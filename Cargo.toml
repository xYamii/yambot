[package]
name = "yambot"
version = "0.1.3"
edition = "2024"

[dependencies]
twitchy = { path = "../twitchy" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.47.1", features = ["full"] }
egui = "0.33.0"
eframe = { version = "0.33.3", features = [
  "default",
  "__screenshot",
] }
egui_extras = { version = "0.33.3", features = ["default", "all_loaders"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
chrono = { version = "0.4.44", features = ["serde"] }
toml = "1.0.6+spec-1.1.0"
project-root = "0.2.2"
log = "0.4.29"
env_logger = "0.11.9"
rodio = "0.22.2"
notify = "8.2.0"
tokio-stream = "0.1.18"

reqwest = { version = "0.13.2", features = ["json"] }
urlencoding = "2.1.3"
futures-util = "0.3"

# HTTP server for overlay
axum = { version = "0.8.8", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["fs", "cors"] }
