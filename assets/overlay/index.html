<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Yambot Stream Overlay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Spinning Wheel Container -->
    <div id="wheel-container" class="hidden">
        <canvas id="wheel-canvas"></canvas>
        <div id="wheel-pointer"></div>
        <div id="wheel-result" class="hidden"></div>
    </div>

    <!-- Song Player -->
    <div id="player-container" class="hidden">
        <!-- Video wrapper: hidden = audio-only mode, visible = shows actual video -->
        <div id="player-video-wrapper" class="video-hidden">
            <div id="yt-iframe"></div>
        </div>
        <p id="player-title"></p>
        <div id="player-progress-bg">
            <div id="player-progress-fill"></div>
        </div>
    </div>

    <!-- Debug Info (hidden in production) -->
    <div id="debug-info" class="debug-panel hidden">
        <h3>Debug Info</h3>
        <p>Connection: <span id="debug-connection">Disconnected</span></p>
        <p>Last Event: <span id="debug-event">None</span></p>
    </div>

    <script src="js/wheel.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
